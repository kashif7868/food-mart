<svg xmlns="http://www.w3.org/2000/svg" viewBox="290 175 540 440" width="540" height="440">
  <defs>
    <linearGradient id="orange" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#FF8A00"/>
      <stop offset="1" stop-color="#FF5E00"/>
    </linearGradient>
    <linearGradient id="orangeMid" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF6A00"/>
      <stop offset="1" stop-color="#FF8C00"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0" stop-color="#B01FC0"/>
      <stop offset="0.55" stop-color="#7A12A8"/>
      <stop offset="1" stop-color="#3E0C78"/>
    </linearGradient>
    <linearGradient id="stem" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6A0FA0"/>
