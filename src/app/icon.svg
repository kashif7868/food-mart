  <path fill="url(#orangeMid)" d="M405,370 L545,370 L490,445 L405,445 Z"/>

  <!-- M -->
  <path fill="url(#purple)" d="M545,370 L612,440 L742,302 Q764,282 788,285 Q808,290 808,318 L808,580 Q808,600 788,600 L742,600 Q722,600 722,580 L722,470 L642,548 Q612,572 582,545 L490,445 Z"/>
